# ============================================
# APPLICATION PROPERTIES
# src/main/resources/application.properties
# ============================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=${PORT:8080}

# ============================================
# SUPABASE DATABASE CONFIGURATION
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# GOOGLE OAUTH 2.0 CONFIGURATION
# ============================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# ============================================
# EMAIL DOMAIN VALIDATION (Option 2)
# ============================================
# ONLY school emails can register with email/password
app.allowed-email-domain=@cit.edu

# Google OAuth accepts any email (no restriction)
# This is handled in the code, not configuration

# ============================================
# FRONTEND URL
# ============================================
app.frontend-url=http://localhost:5173

# ============================================
# CORS CONFIGURATION
# ============================================
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ============================================
# GOOGLE SHEETS CONFIGURATION
# ============================================
google.sheets.api.key=AIzaSyBZQt3P6Ocz_GRhUGGN9yolmQYQiEGPNHk
google.sheets.credentials.path=${GOOGLE_SHEETS_CREDENTIALS_PATH:}

# ============================================
# MODULE 2: DELIVERABLE TRACKER CONFIGURATION
# ============================================
# Sync interval (in milliseconds) - Default: 5 minutes for <1s lag
app.google-sheets-sync-interval=300000
app.check-overdue-interval=1800000
app.check-at-risk-interval=3600000

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.org.springframework.security=DEBUG
logging.level.com.capstone=DEBUG