# ============================================
# APPLICATION PRODUCTION PROPERTIES
# src/main/resources/application-production.properties
# ============================================

# Database (Supabase Transaction Pooler SAFE)
spring.datasource.url=${SPRING_DATASOURCE_URL}&prepareThreshold=0
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP (OPTIMIZED for Supabase PgBouncer Transaction Pooler)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# Disable statement caching for Supabase transaction pooling
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# ============================================
# EMAIL DOMAIN VALIDATION (Option 2) - ADD THIS
# ============================================
# ONLY school emails can register with email/password
app.allowed-email-domain=@cit.edu

# ============================================
# Frontend URL
app.frontend-url=${APP_FRONTEND_URL}

# Server Port
server.port=${PORT:8080}

# CORS
spring.web.cors.allowed-origins=${APP_FRONTEND_URL}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true